# Whole app: docker compose up --build
#   UI      http://localhost:5173
#   API     http://localhost:8000/docs
#   Ollama  http://localhost:11434  (models are pulled on first start: ~6.5 GB)
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot job: downloads the models into the shared volume, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:7b && ollama pull qwen2.5:3b"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////app/db/timecard.db
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: qwen2.5:7b
      LLM_FALLBACK_MODEL: qwen2.5:3b
      LLM_TEMPERATURE: 0
      LLM_TIMEOUT_SECONDS: 300
      PROMPT_VERSION: v1
      LOG_LEVEL: INFO
      SEED_ON_START: "true"
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/db
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  ollama_data:
  backend_data:
